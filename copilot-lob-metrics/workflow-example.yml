# Example GitHub Actions workflow for automated Copilot metrics collection.
#
# To activate: copy this file to .github/workflows/copilot-metrics.yml and
# configure the repository settings listed below. It is kept OUT of
# .github/workflows here on purpose so nothing runs until you opt in.
#
# Required repository configuration:
#   Secret   COPILOT_METRICS_TOKEN  fine-grained PAT with "Organization
#                                   Copilot metrics: read" (or classic
#                                   read:org), from an authorized account
#   Variable COPILOT_METRICS_ORG    organization slug
#   Variable COPILOT_METRICS_TEAMS  comma-separated team slugs (one per LOB)
#
# Note: the committed data/raw files contain per-user IDs and logins —
# only use this workflow in a private repository.

name: Collect Copilot metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC; the collector backfills the last 10 days, so occasional missed runs are fine
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolkit dependencies
        working-directory: copilot-lob-metrics
        run: npm ci

      - name: Collect metrics
        working-directory: copilot-lob-metrics
        env:
          GH_TOKEN: ${{ secrets.COPILOT_METRICS_TOKEN }}
          GH_ORG: ${{ vars.COPILOT_METRICS_ORG }}
        run: npm run collect

      - name: Generate report and dashboard
        working-directory: copilot-lob-metrics
        env:
          GH_TEAM_SLUGS: ${{ vars.COPILOT_METRICS_TEAMS }}
        run: |
          npm run report -- --days 28 --out report.md
          npm run dashboard -- --days 28 --out dashboard.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-dashboard
          path: |
            copilot-lob-metrics/dashboard.html
            copilot-lob-metrics/report.md

      - name: Commit updated data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copilot-lob-metrics/data copilot-lob-metrics/report.md
          git diff --cached --quiet || git commit -m "chore: update Copilot metrics snapshot"
          git push
